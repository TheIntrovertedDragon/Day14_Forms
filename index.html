<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two Truths and a Lie</title>
</head>
<body style="background-color: rgb(196, 237, 238);">
  <h1>Audrey's Two Truth's and a Lie Game</h1>
  <hr>

  <h2>Introductions</h2>
  <form action="" id="name-form">
    <label for="fname">First Name:</label><br />
    <input type="text" name="fname" id="fname"><br />

    <label for="lname">Last Name:</label><br />
    <input type="text" name="lname" id="lname"><br />

    <label for="age">Age:</label><br />
    <input type="number" name="age" id="age"><br />
  </form>
  <br />
  <input type="button" value="SUBMIT" onclick="greet();">
  <p id="greet" style="font-size: x-large;">Welcome!</p>


  <h2>Warm up trivia question</h2>
  <p>What is the only food that cannot go bad?</p>
  <p id="trivia1-answer"></p>
  <form action="">
    <input type="radio" name="trivia1" id="chocolate">
    <label for="chocolate">Dark Chocolate</label><br />

    <input type="radio" name="trivia1" id="tuna">
    <label for="chocolate">Tuna</label><br />

    <input type="radio" name="trivia1" id="honey">
    <label for="chocolate">Honey</label><br />
  </form>

  <input type="button" value="SUBMIT" onclick="trivia1()">


  <h2>Two truth's and a lie</h2>
  <p>Which one is the lie...</p>
  <p id="truthsandlie"></p>
  <form>
    <input type="radio" name="tandl" id="peril">
    <label for="peril">Peril is one of my favorite Wings of Fire characters</label><br />

    <input type="radio" name="tandl" id="glory">
    <label for="glory">Glory is one of my favorite Wings of Fire characters</label><br />

    <input type="radio" name="tandl" id="tsunami">
    <label for="tsunami">Tsunami is one of my favorite Wings of Fire characters</label><br />
  </form>

  <input type="button" value="SUBMIT" onclick="tandl()">


  <script src="javascript/truth.js"></script>
</body>
</html>
